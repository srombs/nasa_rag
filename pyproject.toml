[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nasa-rag"
version = "0.1.0"
description = "A Python project for retrieval-augmented generation with NASA data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = ["faiss-cpu", "numpy>=1.25", "openai>=1.0", "rank-bm25>=0.2.2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
nasa-rag = "nasa_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nasa_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
